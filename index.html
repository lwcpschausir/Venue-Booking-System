<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>學校訂場系統</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #FBF5EB;
      font-family: sans-serif;
    }

    /* 載入畫面 */
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: #FBF5EB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      gap: 16px;
    }
    #loadingScreen h2 {
      font-size: 22px;
      color: #423D33;
      font-weight: 700;
    }
    #loadingScreen p {
      font-size: 14px;
      color: #7A715F;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #FFE9C7;
      border-top-color: #F39200;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* iframe */
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 載入畫面 -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <h2>🏫 學校訂場系統</h2>
    <p>正在載入，請稍候...</p>
  </div>

  <!-- Apps Script iframe -->
  <iframe
    id="appFrame"
    src="https://script.google.com/a/macros/lwcps.edu.hk/s/AKfycbwXGnYYtLsO_v0_eARpRC8GRWHMRbrXYt3_6rCiR2xHD7tBb5cDCzKyXjTpCfNNmZJe/exec"
    allow="fullscreen"
    onload="document.getElementById('loadingScreen').style.display='none'">
  </iframe>

</body>
</html>
