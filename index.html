<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>學校訂場系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; width:100%; background:#FBF5EB; font-family:"Noto Sans TC",sans-serif; overflow:hidden; }

    /* ── 共用畫面容器 ── */
    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; padding: 24px; text-align: center;
      background: #FBF5EB;
      transition: opacity 0.3s;
    }
    .screen.hidden { opacity:0; pointer-events:none; }

    .logo { font-size: 64px; line-height: 1; }
    h1 { font-size: 24px; font-weight: 700; color: #423D33; }
    .subtitle { font-size: 15px; color: #7A715F; max-width: 320px; line-height: 1.6; }

    /* 主按鈕 */
    .btn-primary {
      background: #F39200; color: #fff;
      border: none; padding: 15px 40px;
      border-radius: 12px; font-size: 17px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 16px rgba(243,146,0,0.4);
      transition: all 0.15s; display: inline-flex;
      align-items: center; gap: 10px;
    }
    .btn-primary:hover { background:#D67A00; transform:translateY(-2px); }
    .btn-primary:disabled { background:#D4CCBB; cursor:not-allowed; transform:none; box-shadow:none; }

    /* 次要按鈕 */
    .btn-secondary {
      background: none; border: none;
      font-size: 13px; color: #A89F8C;
      text-decoration: underline; cursor: pointer;
      font-family: inherit;
    }
    .btn-secondary:hover { color: #7A715F; }

    /* 狀態提示框 */
    .hint-box {
      background: #F4EFE6; border-radius: 10px;
      padding: 14px 20px; max-width: 340px;
      font-size: 13px; color: #5C5447;
      line-height: 1.7; text-align: left;
    }
    .hint-box.error {
      background: #F8D7D6; color: #8B2825;
      border: 1px solid #D9534F;
    }
    .hint-box.success {
      background: #DCEFCB; color: #467D20;
      border: 1px solid #5BA02C;
    }

    /* 轉圈 */
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #FFE9C7;
      border-top-color: #F39200;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* iframe */
   #appFrame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none; display: block;
      opacity: 0; transition: opacity 0.4s;
      z-index: 0;
      pointer-events: none; /* ← 加這行，未顯示時不攔截點擊 */
    }
    #appFrame.visible {
      opacity: 1;
      z-index: 5;
      pointer-events: auto; /* ← 載入後才開啟點擊 */
    }
  </style>
</head>
<body>

  <!-- 畫面 A：初始 / 登入按鈕 -->
  <div class="screen" id="screenLogin">
    <div class="logo">🏫</div>
    <h1>學校訂場系統</h1>
    <p class="subtitle">請用學校 Google 帳號登入後使用。</p>
    <button class="btn-primary" id="btnLogin" onclick="handleLogin()">
      🔑 用 Google 帳號登入
    </button>
    <button class="btn-secondary" onclick="directOpen()">直接在新分頁開啟 →</button>
  </div>

  <!-- 畫面 B：正在檢測中 -->
  <div class="screen hidden" id="screenChecking">
    <div class="spinner"></div>
    <h1>正在檢測登入狀態</h1>
    <p class="subtitle">請稍候...</p>
  </div>

  <!-- 畫面 C：登入成功，載入系統 -->
  <div class="screen hidden" id="screenLoading">
    <div class="spinner"></div>
    <h1>🏫 正在載入訂場系統</h1>
    <p class="subtitle" id="loadingEmail"></p>
  </div>

  <!-- 畫面 D：非學校帳號 -->
  <div class="screen hidden" id="screenWrongAccount">
    <div class="logo">⚠️</div>
    <h1>請使用學校帳號</h1>
    <div class="hint-box error" id="wrongAccountMsg"></div>
    <button class="btn-primary" onclick="switchAccount()">
      🔄 切換 Google 帳號
    </button>
    <button class="btn-secondary" onclick="directOpen()">直接在新分頁開啟 →</button>
  </div>

  <!-- Apps Script iframe -->
  <iframe id="appFrame" src=""></iframe>

  <script>
    const SCRIPT_URL = 'YOUR_SCRIPT_URL'; // ← 換成你的 Apps Script /exec URL
    const SCHOOL_DOMAIN = 'lwcps.edu.hk';  // ← 換成你的學校 domain

    // 修正 Bug 1：XSS 防護，用安全方式設定 innerHTML
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 修正 Bug 2：用 flag 防止 onload 和 timeout 衝突
    let frameLoaded = false;

    // 修正 Bug 6：合併重複的 redirectToGoogleLogin 和 switchAccount
    function redirectToGoogleLogin() {
      const loginUrl = 'https://accounts.google.com/signin/v2/identifier'
        + '?hd=' + SCHOOL_DOMAIN
        + '&continue=' + encodeURIComponent(window.location.href)
        + '&prompt=select_account';
      window.location.href = loginUrl;
    }

    function switchAccount() {
      redirectToGoogleLogin();
    }

    function directOpen() {
      window.open(SCRIPT_URL, '_blank');
    }

    function showScreen(id) {
      ['screenLogin','screenChecking','screenLoading','screenWrongAccount'].forEach(s => {
        document.getElementById(s).classList.add('hidden');
      });
      if (id) document.getElementById(id).classList.remove('hidden');
    }

    // 修正 Bug 5：加入 res.ok 檢查
    // 修正 Bug 3：catch 加入 console.error
    async function checkLoginStatus() {
      const res = await fetch(SCRIPT_URL + '?check=1', {
        cache: 'no-store',
        credentials: 'include'
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }

    // 頁面載入時靜默檢查
    window.addEventListener('load', async () => {
      try {
        const data = await checkLoginStatus();
        if (data.loggedIn && data.isSchool) {
          loadApp(data.email);
        }
        // 未登入或非學校帳號 → 保持登入按鈕畫面
      } catch(e) {
        console.error('靜默登入檢測失敗：', e);
        // 保持登入按鈕畫面，等用戶操作
      }
    });

    // 用戶點擊「用 Google 帳號登入」
    async function handleLogin() {
      showScreen('screenChecking');
      try {
        const data = await checkLoginStatus();

        if (data.loggedIn && data.isSchool) {
          // ✅ 學校帳號，進入系統
          loadApp(data.email);

        } else if (data.loggedIn && !data.isSchool) {
          // ⚠️ 非學校帳號，修正 Bug 1：用 escapeHtml 防 XSS
          showScreen('screenWrongAccount');
          document.getElementById('wrongAccountMsg').innerHTML =
            '你目前登入的帳號是：<br><b>' + escapeHtml(data.email) + '</b><br><br>'
            + '請切換至 <b>@' + escapeHtml(SCHOOL_DOMAIN) + '</b> 帳號後再試。';

        } else {
          // ❌ 未登入，跳去 Google 登入頁
          redirectToGoogleLogin();
        }

      } catch(e) {
        console.error('登入檢測失敗：', e);
        // 無法連線或 API 錯誤，跳去 Google 登入
        redirectToGoogleLogin();
      }
    }

    // 載入 iframe
    function loadApp(email) {
      showScreen('screenLoading');
      if (email) {
        document.getElementById('loadingEmail').textContent = '已驗證：' + email;
      }

      const frame = document.getElementById('appFrame');
      frameLoaded = false;
      frame.src = SCRIPT_URL;

      // 修正 Bug 2：用 frameLoaded flag 防止衝突
      frame.onload = () => {
        if (!frameLoaded) {
          frameLoaded = true;
          frame.classList.add('visible');
          showScreen(null);
        }
      };

      // 修正 Bug 4：加入 iframe onerror 處理
      frame.onerror = () => {
        console.error('iframe 載入失敗');
        if (!frameLoaded) {
          frameLoaded = true;
          showScreen('screenLoading');
          document.getElementById('loadingEmail').innerHTML =
            '載入失敗，<a href="' + SCRIPT_URL + '" target="_blank" '
            + 'style="color:#F39200;font-weight:700;">點此直接開啟</a>';
        }
      };

      // 修正 Bug 2：timeout 也用 flag 防止 onload 後再觸發
      setTimeout(() => {
        if (!frameLoaded) {
          frameLoaded = true;
          console.warn('iframe 載入超時');
          showScreen('screenLoading');
          document.getElementById('loadingEmail').innerHTML =
            '載入時間過長，<a href="' + SCRIPT_URL + '" target="_blank" '
            + 'style="color:#F39200;font-weight:700;">點此直接開啟</a>';
        }
      }, 15000);
    }
</script>

</body>
</html>
