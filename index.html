<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學校訂場系統</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; width:100%; background:#FBF5EB; font-family:"Noto Sans TC",sans-serif; overflow:hidden; }
    
    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; padding: 24px; text-align: center;
      background: #FBF5EB;
      z-index: 10;
    }
    .screen.hidden { display: none; }
    
    .logo { font-size: 64px; }
    h1 { font-size: 24px; font-weight: 700; color: #423D33; }
    .subtitle { font-size: 15px; color: #7A715F; max-width: 320px; line-height: 1.6; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #FFE9C7;
      border-top-color: #F39200;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    
    .btn-primary {
      background: #F39200; color: #fff;
      border: none; padding: 15px 40px;
      border-radius: 12px; font-size: 17px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 16px rgba(243,146,0,0.4);
    }
    .btn-secondary {
      background: none; border: none;
      font-size: 13px; color: #A89F8C;
      text-decoration: underline; cursor: pointer;
      font-family: inherit;
    }
    
    /* iframe：載入後才顯示和開啟點擊 */
    #appFrame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none;
      display: none;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    #appFrame.visible {
      display: block;
      opacity: 1;
      pointer-events: auto;
      z-index: 5;
    }
  </style>
</head>
<body>

  <!-- 載入中畫面 -->
  <div class="screen" id="screenLoading">
    <div class="logo">🏫</div>
    <h1>學校訂場系統</h1>
    <p class="subtitle">正在載入...</p>
    <div class="spinner"></div>
    <button class="btn-secondary" onclick="directOpen()">如未自動進入，請點此</button>
  </div>

  <!-- 需要登入畫面（iframe 無法顯示時才出現） -->
  <div class="screen hidden" id="screenNeedLogin">
    <div class="logo">🔑</div>
    <h1>請先登入 Google 帳號</h1>
    <p class="subtitle">請先用學校 Google 帳號登入，然後重新整理此頁。</p>
    <button class="btn-primary" onclick="openGmail()">📧 開啟 Gmail 登入</button>
    <button class="btn-secondary" onclick="directOpen()">直接開啟訂場系統 →</button>
  </div>

  <!-- iframe 載入 Apps Script -->
  <iframe id="appFrame" src="about:blank"></iframe>

  <script>
    const SCRIPT_URL = 'YOUR_APPS_SCRIPT_URL';  // ← 換成你的 Apps Script /exec URL
    const SCHOOL_DOMAIN = 'lwcps.edu.hk';

    let frameLoaded = false;

    function directOpen() {
      window.open(SCRIPT_URL, '_blank');
    }

    function openGmail() {
      window.open('https://mail.google.com', '_blank');
    }

    // 直接用 iframe 載入 Apps Script
    function loadApp() {
      const frame = document.getElementById('appFrame');
      frameLoaded = false;
      frame.src = SCRIPT_URL;

      frame.onload = () => {
        if (!frameLoaded) {
          frameLoaded = true;
          frame.classList.add('visible');
          document.getElementById('screenLoading').classList.add('hidden');
        }
      };

      // 15 秒超時提示
      setTimeout(() => {
        if (!frameLoaded) {
          frameLoaded = true;
          console.warn('iframe 載入超時');
          // 顯示需要登入的提示
          document.getElementById('screenLoading').classList.add('hidden');
          document.getElementById('screenNeedLogin').classList.remove('hidden');
        }
      }, 15000);
    }

    // 頁面載入時立即開始
    window.addEventListener('load', loadApp);
  </script>

</body>
</html>
